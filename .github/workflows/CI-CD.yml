name: CI/CD Deployment Pipeline

# 1. WHEN to trigger the pipeline
on:
  push:
    branches: [ main ]  # Triggers when code is pushed to the main branch

jobs:
  # JOB 1: Test the application (Continuous Integration)
  build-and-test:
    runs-on: ubuntu-latest # The temporary cloud virtual machine to use
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4 # Copies your repository code onto the runner

    - name: Set up Environment
      run: echo "Installing language runtimes (like Node.js, Python, or Java) goes here"

    - name: Run Tests
      run: echo "Running your automated tests..."

  # JOB 2: Deploy to your server (Continuous Deployment)
  deploy:
    needs: build-and-test # Only runs if the testing job passes successfully
    runs-on: ubuntu-latest
    
    steps:
    - name: Deploy to Server via SSH
      uses: appleboy/ssh-action@v1.0.3 # A pre-built community tool to securely connect to servers
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          cd /var/www/my-app
          git pull origin main
          echo "Restarting application server..."
