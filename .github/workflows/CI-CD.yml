name: CI/CD Pipeline

# Build & test run on every push/PR to dev, staging, or main.
# Deploy runs only on a direct push to one of those branches (or a manual
# "Run workflow"), and picks the matching GitHub Environment automatically —
# that's the "branch-based condition" replacing three separate files.
on:
  push:
    branches: [DEV, Staging, main]
  pull_request:
    branches: [DEV, Staging, main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
         
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build --if-present

  deploy:
    needs: build-and-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # This line IS the branch-based condition: whichever branch triggered the
    # run selects the matching GitHub Environment (dev / staging / production).
    # Each Environment (set up in repo Settings > Environments) holds its own
    # secrets and variables under the SAME names, so nothing below needs an
    # if/else for credentials, paths, or app names.
    environment: >-
      ${{
        github.ref_name == 'main' && 'Production' ||
        github.ref_name == 'Staging' && 'Staging' ||
        'Development'
      }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd ${{ vars.DEPLOY_PATH }}
            git pull origin ${{ github.ref_name }}
            npm ci --production
            npm run build
            pm2 restart ${{ vars.PM2_APP_NAME }}

      - name: Deployment summary
        if: always()
        run: echo "Deploy (${{ github.ref_name }} -> ${{ job.status }})"
